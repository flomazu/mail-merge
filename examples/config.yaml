# Example config: individual mode, Excel input.
# Relative paths are resolved against the folder of this file.

input:
  file: recipients.xlsx
  sheet: Recipients
  header_row: 1

columns:
  email: E-Mail

mail:
  mode: individual
  subject: "Einladung zum Kundentag für {Firma}"
  template: template.txt
  greeting: "Guten Tag {Name},"
  greeting_fallback: "Sehr geehrte Damen und Herren,"
  attachment: agenda.pdf

smtp:
  host: localhost
  port: 1025
  security: none
  from_address: einladung@example.com
  from_name: Beispiel GmbH
  pause_seconds: 0.5

output_dir: output
send_log: output/send_log.csv
